server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No /api/ proxy here: behind the ALB, the listener routes /api/* directly to
    # the backend target group, so nginx only ever serves the SPA. (A proxy_pass
    # to a "backend" host would also fail to resolve in Fargate and crash nginx.)

    # SPA fallback — let the client-side router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
